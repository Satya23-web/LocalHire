<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalHire | Professional Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; } /* Brighter, light grey background */
        .navbar { background: linear-gradient(90deg, #007bff, #6610f2); } /* Vibrant gradient */
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
    <a class="navbar-brand fw-bold" href="/">🏠 LocalHire</a>
    <div>
        {% if user.is_authenticated %}
            <span class="text-white me-3">Welcome, {{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-light btn-sm">Login</a>
        {% endif %}
    </div>
        </div>
    </nav>

</body>
</html>
